<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="f4-title f4-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="f4-title">The verdict spine</title>
  <desc id="f4-desc">Shaping and sweeps run first: detectors, probes, the contested-day check, then the bid ladder, the staircase and two sweeps. Then eight gates in walk order: integrity, lifecycle, evidence, price event, action lock, automation, risk bars, terminals. Each gate can claim a card for a lane; the first claim wins.</desc>
  <style>
    .f4-ink{fill:#17202b}.f4-mut{fill:#5b6775}.f4-h{font-size:12.5px;font-weight:700}.f4-b{font-size:11px}
    .f4-cap{font-size:10px;font-weight:700;letter-spacing:.09em}
    .f4-box{fill:#fff;stroke:#c9d1da;stroke-width:1.1}.f4-g{fill:#fff;stroke:#3b4cc0;stroke-width:1.1}
    .f4-ar{stroke:#5b6775;stroke-width:1.3;fill:none}
    .f4-ob{fill:#eef1f4;stroke:#8793a1}.f4-ho{fill:#fdf1d8;stroke:#b45309}.f4-es{fill:#f3e8fb;stroke:#7e3fb0}
    .f4-na{fill:#fbe9e3;stroke:#c2410c}.f4-ac{fill:#e6f3f1;stroke:#0f766e}
    .f4-p{font-size:10.5px;font-weight:700}
  </style>
  <defs><marker id="f4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6775"/></marker></defs>
  <text class="f4-cap f4-mut" x="8" y="18">FIRST: SHAPING AND SWEEPS. MINTED CARDS WALK THE GATES LIKE ANY OTHER CARD</text>
  <rect class="f4-box" x="8" y="30" width="170" height="86" rx="8"/><text class="f4-h f4-ink" x="19" y="51">1  Detectors</text><text class="f4-b f4-mut" x="19" y="69.0">winner went dark;</text><text class="f4-b f4-mut" x="19" y="83.5">justify or kill (spend</text><text class="f4-b f4-mut" x="19" y="98.0">with no attributed sales)</text><rect class="f4-box" x="186" y="30" width="170" height="86" rx="8"/><text class="f4-h f4-ink" x="197" y="51">2  Probes</text><text class="f4-b f4-mut" x="197" y="69.0">bounded tests for</text><text class="f4-b f4-mut" x="197" y="83.5">entities under the</text><text class="f4-b f4-mut" x="197" y="98.0">evidence floor</text><rect class="f4-box" x="364" y="30" width="170" height="86" rx="8"/><text class="f4-h f4-ink" x="375" y="51">3  Contested days</text><text class="f4-b f4-mut" x="375" y="69.0">a collision whose</text><text class="f4-b f4-mut" x="375" y="83.5">campaigns take turns</text><text class="f4-b f4-mut" x="375" y="98.0">is a schedule: vetoed</text><rect class="f4-box" x="542" y="30" width="170" height="86" rx="8"/><text class="f4-h f4-ink" x="553" y="51">4  Graduate</text><text class="f4-b f4-mut" x="553" y="69.0">bid-down before pause;</text><text class="f4-b f4-mut" x="553" y="83.5">staircase raises;</text><text class="f4-b f4-mut" x="553" y="98.0">loss and ramp sweeps</text>
  <path class="f4-ar" d="M178 73H185M356 73H363M534 73H541"/>
  <path class="f4-ar" d="M71 116V156" marker-end="url(#f4-a)"/>
  <text class="f4-cap f4-mut" x="88" y="142">THEN: EIGHT GATES IN WALK ORDER. THE FIRST GATE TO CLAIM A CARD WINS</text>
  <rect class="f4-g" x="8" y="160" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="177.5">Integrity</text><path class="f4-ar" d="M134 173H154"/><path class="f4-ar" d="M71 186V193"/><rect class="f4-ob" x="158" y="162" width="146" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="177">OBSERVE(quarantine)</text><rect class="f4-ob" x="310" y="162" width="186" height="22" rx="11"/><text class="f4-p f4-ink" x="321" y="177">OBSERVE(bad-budget-field)</text><text class="f4-b f4-mut" x="506" y="177">one-day cohort; cap under 100</text><rect class="f4-g" x="8" y="193" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="210.5">Lifecycle</text><path class="f4-ar" d="M134 206H154"/><path class="f4-ar" d="M71 219V226"/><rect class="f4-ho" x="158" y="195" width="140" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="210">HOLD(launch-grace)</text><text class="f4-b f4-mut" x="308" y="210">no cuts in the first 5 live days</text><rect class="f4-g" x="8" y="226" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="243.5">Evidence</text><path class="f4-ar" d="M134 239H154"/><path class="f4-ar" d="M71 252V259"/><rect class="f4-ob" x="158" y="228" width="160" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="243">OBSERVE(insufficient)</text><text class="f4-b f4-mut" x="328" y="243">under 1,000 window impressions</text><rect class="f4-g" x="8" y="259" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="276.5">Price event</text><path class="f4-ar" d="M134 272H154"/><path class="f4-ar" d="M71 285V292"/><rect class="f4-ho" x="158" y="261" width="133" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="276">HOLD(price-event)</text><text class="f4-b f4-mut" x="301" y="276">discount swing of 8 points; inert from plan()</text><rect class="f4-g" x="8" y="292" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="309.5">Action lock</text><path class="f4-ar" d="M134 305H154"/><path class="f4-ar" d="M71 318V325"/><rect class="f4-ho" x="158" y="294" width="173" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="309">HOLD(monitoring-window)</text><text class="f4-b f4-mut" x="341" y="309">one open action per entity for 7 days</text><rect class="f4-g" x="8" y="325" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="342.5">Automation</text><path class="f4-ar" d="M134 338H154"/><path class="f4-ar" d="M71 351V358"/><rect class="f4-es" x="158" y="327" width="192" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="342">ESCALATE(automation-owned)</text><text class="f4-b f4-mut" x="360" y="342">a bidder owns the lever; inert from plan()</text><rect class="f4-g" x="8" y="358" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="375.5">Risk bars</text><path class="f4-ar" d="M134 371H154"/><path class="f4-ar" d="M71 384V391"/><rect class="f4-ob" x="158" y="360" width="140" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="375">OBSERVE(below-bar)</text><text class="f4-b f4-mut" x="308" y="375">confidence under: watch 25, bid 45, raise 55, cut 65</text><rect class="f4-g" x="8" y="391" width="126" height="26" rx="7"/><text class="f4-h f4-ink" x="19" y="408.5">Terminals</text><path class="f4-ar" d="M134 404H154"/><rect class="f4-ac" x="158" y="393" width="42" height="22" rx="11"/><text class="f4-p f4-ink" x="169" y="408">ACT</text><rect class="f4-ob" x="206" y="393" width="146" height="22" rx="11"/><text class="f4-p f4-ink" x="217" y="408">OBSERVE(unfillable)</text><rect class="f4-na" x="358" y="393" width="284" height="22" rx="11"/><text class="f4-p f4-ink" x="369" y="408">NO-ACTION(conflict | gate | partitioned)</text>
  <text class="f4-b f4-mut" x="8" y="438">Every gate is inert when its input is missing: the spine fails open.</text>
  <text class="f4-b f4-mut" x="8" y="453">Not acting is recorded as a verdict, never as silence.</text>
</svg>
