  <text class="f2-v" fill="#fff" font-weight="700" x="440.1" y="212.5">-0.219</text>
  <text class="f2-xs f2-mut" x="5" y="278">Signed log-point contributions to d ln ROAS, 2026-03-02..03-31 against 2026-01-31..03-01. Both panels share one scale. A CPM rise</text>
  <text class="f2-xs f2-mut" x="5" y="293">is drawn as a negative bar because CPM enters the identity as a divisor. Source: SyntheticAdapter(), seed 7.</text>
</svg>
