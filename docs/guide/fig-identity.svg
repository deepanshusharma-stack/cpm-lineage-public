  <text class="f2-l f2-ink" x="377" y="162">CPM</text>
  <rect class="f2-neg" x="416.2" y="146" width="223.8" height="24" rx="3"/>
  <text class="f2-v" fill="#fff" x="424.2" y="162.5">-0.236</text>
  <text class="f2-l f2-ink" font-weight='700' x="377" y="212">ROAS</text>
