<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-labelledby="f1-title f1-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="f1-title">The end-to-end flow of cpm-lineage</title>
  <desc id="f1-desc">Feeds enter two entry points. diagnose runs the identity, attribution and the budget, keyword and CPM checks. plan runs the rule families, the pipeline and the verdict spine. An operator applies cards, the ledger scores them, and realised win rates feed back into the next plan.</desc>
  <style>
    .f1-ink{fill:#17202b}.f1-mut{fill:#5b6775}.f1-b{font-size:11px}
    .f1-h{font-size:12.5px;font-weight:700}.f1-cap{font-size:10px;font-weight:700;letter-spacing:.09em}
    .f1-box{fill:#fff;stroke:#c9d1da;stroke-width:1.1}
    .f1-dg{fill:#e6f3f1;stroke:#0f766e;stroke-width:1.1}.f1-pl{fill:#e8ebfb;stroke:#3b4cc0;stroke-width:1.1}
    .f1-ld{fill:#fdf1d8;stroke:#b45309;stroke-width:1.1}
    .f1-ar{stroke:#5b6775;stroke-width:1.4;fill:none}.f1-fb{stroke:#b45309;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    .f1-n{font-size:11.5px;font-weight:700;fill:#fff}
  </style>
  <defs>
    <marker id="f1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6775"/></marker>
    <marker id="f1-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <rect class="f1-box" x="8" y="30" width="136" height="374" rx="10"/>
  <text class="f1-cap f1-mut" x="20" y="52">YOUR DATA</text>
  <text class="f1-h f1-ink" x="20" y="76">PerfRow</text>
  <text class="f1-b f1-mut" x="20" y="93">required: date, entity,</text>
  <text class="f1-b f1-mut" x="20" y="108">spend, impressions;</text>
  <text class="f1-b f1-mut" x="20" y="123">sales, units for ROAS</text>
  <line x1="20" y1="138" x2="132" y2="138" stroke="#c9d1da"/>
  <text class="f1-cap f1-mut" x="20" y="161">OPTIONAL FEEDS</text>
  <text class="f1-b f1-ink" x="20" y="186">Entity</text>
  <text class="f1-b f1-ink" x="20" y="203">TargetingUnit</text>
  <text class="f1-b f1-ink" x="20" y="220">Product</text>
  <text class="f1-b f1-ink" x="20" y="237">MarketRow</text>
  <text class="f1-b f1-ink" x="20" y="254">OfftakeRow</text>
  <text class="f1-b f1-ink" x="20" y="271">ShelfRow</text>
  <text class="f1-b f1-ink" x="20" y="288">BudgetDayRow</text>
  <text class="f1-b f1-ink" x="20" y="305">ChangeEvent</text>
  <line x1="20" y1="320" x2="132" y2="320" stroke="#c9d1da"/>
  <text class="f1-h f1-ink" x="20" y="344">PlatformProfile</text>
  <text class="f1-b f1-mut" x="20" y="361">what differs between</text>
  <text class="f1-b f1-mut" x="20" y="376">platforms, declared</text>
  <text class="f1-b f1-mut" x="20" y="391">once</text>

  <rect class="f1-dg" x="162" y="30" width="412" height="178" rx="12"/>
  <text class="f1-h" fill="#0f766e" x="176" y="52">diagnose(data)</text>
  <text class="f1-b f1-mut" x="276" y="52">what happened, and why</text>
    <rect class="f1-box" x="172" y="62" width="126" height="92" rx="8"/>
    <circle cx="190" cy="82" r="10.5" fill="#0f766e"/><text class="f1-n" x="190" y="86" text-anchor="middle">1</text>
    <text class="f1-h f1-ink" x="206" y="86.5">Identity</text>
    <text class="f1-b f1-mut" x="183" y="109.0">ROAS = ICR1k x ASP</text>
    <text class="f1-b f1-mut" x="183" y="123.5">/ CPM: an exact</text>
    <text class="f1-b f1-mut" x="183" y="138.0">split, no model</text>
    <rect class="f1-box" x="305" y="62" width="126" height="92" rx="8"/>
    <circle cx="323" cy="82" r="10.5" fill="#0f766e"/><text class="f1-n" x="323" y="86" text-anchor="middle">2</text>
    <text class="f1-h f1-ink" x="339" y="86.5">Attribution</text>
    <text class="f1-b f1-mut" x="316" y="109.0">11 levers, two</text>
    <text class="f1-b f1-mut" x="316" y="123.5">regressions, a jury,</text>
    <text class="f1-b f1-mut" x="316" y="138.0">one verdict</text>
    <rect class="f1-box" x="438" y="62" width="126" height="92" rx="8"/>
    <circle cx="456" cy="82" r="10.5" fill="#0f766e"/><text class="f1-n" x="456" y="86" text-anchor="middle">3</text>
    <text class="f1-h f1-ink" x="472" y="86.5">Checks</text>
    <text class="f1-b f1-mut" x="449" y="109.0">budget, CPM,</text>
    <text class="f1-b f1-mut" x="449" y="123.5">keywords, stock,</text>
    <text class="f1-b f1-mut" x="449" y="138.0">collisions</text>
  <path class="f1-ar" d="M298 108H304" marker-end="url(#f1-a)"/>
  <path class="f1-ar" d="M431 108H437" marker-end="url(#f1-a)"/>
  <rect x="172" y="164" width="392" height="32" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1"/>
  <text class="f1-b f1-ink" x="184" y="184"><tspan font-weight="700">Diagnosis</tspan>   typed findings and a read per entity</text>

  <rect class="f1-pl" x="162" y="226" width="412" height="178" rx="12"/>
  <text class="f1-h" fill="#3b4cc0" x="176" y="248">plan(data)</text>
  <text class="f1-b f1-mut" x="246" y="248">what should be done</text>
    <rect class="f1-box" x="172" y="258" width="126" height="92" rx="8"/>
    <circle cx="190" cy="278" r="10.5" fill="#3b4cc0"/><text class="f1-n" x="190" y="282" text-anchor="middle">4</text>
    <text class="f1-h f1-ink" x="206" y="282.5">Rule families</text>
    <text class="f1-b f1-mut" x="183" y="305.0">eight families</text>
    <text class="f1-b f1-mut" x="183" y="319.5">propose candidate</text>
    <text class="f1-b f1-mut" x="183" y="334.0">cards</text>
    <rect class="f1-box" x="305" y="258" width="126" height="92" rx="8"/>
    <circle cx="323" cy="278" r="10.5" fill="#3b4cc0"/><text class="f1-n" x="323" y="282" text-anchor="middle">5</text>
    <text class="f1-h f1-ink" x="339" y="282.5">Pipeline</text>
    <text class="f1-b f1-mut" x="316" y="305.0">holdout, conflicts,</text>
    <text class="f1-b f1-mut" x="316" y="319.5">confidence, caps,</text>
    <text class="f1-b f1-mut" x="316" y="334.0">waves</text>
    <rect class="f1-box" x="438" y="258" width="126" height="92" rx="8"/>
    <circle cx="456" cy="278" r="10.5" fill="#3b4cc0"/><text class="f1-n" x="456" y="282" text-anchor="middle">6</text>
    <text class="f1-h f1-ink" x="472" y="282.5">Verdicts</text>
    <text class="f1-b f1-mut" x="449" y="305.0">ACT, OBSERVE,</text>
    <text class="f1-b f1-mut" x="449" y="319.5">HOLD, ESCALATE,</text>
    <text class="f1-b f1-mut" x="449" y="334.0">NO-ACTION</text>
  <path class="f1-ar" d="M298 304H304" marker-end="url(#f1-a)"/>
  <path class="f1-ar" d="M431 304H437" marker-end="url(#f1-a)"/>
  <rect x="172" y="360" width="392" height="32" rx="6" fill="#fff" stroke="#3b4cc0" stroke-width="1"/>
  <text class="f1-b f1-ink" x="184" y="380"><tspan font-weight="700">Plan</tspan>   cards with a status, a wave, two scores and a verdict</text>

  <path class="f1-ar" d="M144 150H160" marker-end="url(#f1-a)"/>
  <path class="f1-ar" d="M144 314H160" marker-end="url(#f1-a)"/>

  <rect class="f1-box" x="590" y="238" width="122" height="78" rx="8"/>
  <text class="f1-h f1-ink" x="601" y="260">Operator</text>
  <text class="f1-b f1-mut" x="601" y="278">applies or skips;</text>
  <text class="f1-b f1-mut" x="601" y="293">nothing is</text>
  <text class="f1-b f1-mut" x="601" y="308">auto-applied</text>
  <rect class="f1-ld" x="590" y="338" width="122" height="96" rx="8"/>
  <circle cx="608" cy="358" r="10.5" fill="#b45309"/><text class="f1-n" x="608" y="362" text-anchor="middle">7</text>
  <text class="f1-h f1-ink" x="624" y="362.5">Ledger</text>
  <text class="f1-b f1-mut" x="601" y="384">ROAS before and</text>
  <text class="f1-b f1-mut" x="601" y="399">after at 7, 14 and</text>
  <text class="f1-b f1-mut" x="601" y="414">30 days; a label</text>
  <text class="f1-b f1-mut" x="601" y="429">per action</text>
  <path class="f1-ar" d="M574 276H588" marker-end="url(#f1-a)"/>
  <path class="f1-ar" d="M651 316V336" marker-end="url(#f1-a)"/>

  <path class="f1-fb" d="M651 434V456H368V406" marker-end="url(#f1-b)"/>
  <text class="f1-b" fill="#8a4107" x="162" y="478">Feedback: realised win rates set confidence; the applied history arms locks and cooldowns.</text>
</svg>
