[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpm-lineage"
version = "0.1.0"
description = "Platform-agnostic optimisation and diagnosis framework for CPM-billed ad platforms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deepanshu Sharma" }]
keywords = ["advertising", "cpm", "retail-media", "optimisation", "attribution", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/deepanshusharma-stack/cpm-lineage-public"
Issues = "https://github.com/deepanshusharma-stack/cpm-lineage-public/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpm_lineage = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"   # quiet by default; run "python -m pytest -v" for names
